[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analyser"
version = "0.1.0"
description = "Standalone Kdzwy Excel finance dashboard"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "requests>=2.31,<3"]

[project.optional-dependencies]
login = ["playwright>=1.40"]
dev = ["pytest>=8,<10"]

[project.scripts]
data-analyser = "data_analyser.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
data_analyser = ["template_layout.json", "rd_template.xlsx"]

[tool.pytest.ini_options]
pythonpath = ["python"]
